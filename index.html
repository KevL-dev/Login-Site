<!doctype html>
<html lang="de" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="style.css" />
    <title>Login-Seite | Kevin</title>
  </head>

  <body>
    <main class="page">
      <section
        class="container"
        id="container"
        aria-label="Login und Registrierung"
      >
        <header class="container__header">
          <h1 class="sr-only">Login & Registrierung</h1>

          <button
            id="theme-toggle"
            class="icon-btn"
            type="button"
            aria-label="Theme wechseln"
          >
            <i class="fa-solid fa-moon" aria-hidden="true"></i>
          </button>
        </header>

        <div class="form-container sign-up" aria-label="Registrieren">
          <form id="signup-form" novalidate>
            <h2>Registrieren</h2>

            <div class="social-icons" aria-label="Social Login (Demo)">
              <a href="#" class="icon" aria-label="Mit Google registrieren"
                ><i class="fa-brands fa-google-plus-g"></i
              ></a>
              <a href="#" class="icon" aria-label="Mit Facebook registrieren"
                ><i class="fa-brands fa-facebook-f"></i
              ></a>
              <a href="#" class="icon" aria-label="Mit GitHub registrieren"
                ><i class="fa-brands fa-github"></i
              ></a>
              <a href="#" class="icon" aria-label="Mit LinkedIn registrieren"
                ><i class="fa-brands fa-linkedin"></i
              ></a>
              <a href="#" class="icon" aria-label="Mit Xing registrieren"
                ><i class="fa-brands fa-xing"></i
              ></a>
            </div>

            <p class="muted">oder nutzen Sie Ihre E-Mail zum Registrieren</p>

            <label class="field">
              <span class="field__label">Name</span>
              <input
                name="name"
                type="text"
                placeholder="Max Mustermann"
                autocomplete="name"
                required
              />
            </label>

            <label class="field">
              <span class="field__label">E-Mail</span>
              <input
                name="email"
                type="email"
                placeholder="max@mail.de"
                autocomplete="email"
                required
              />
            </label>

            <label class="field">
              <span class="field__label">Passwort</span>
              <input
                name="password"
                type="password"
                placeholder="Mind. 8 Zeichen"
                autocomplete="new-password"
                minlength="8"
                required
              />
            </label>

            <button class="primary-btn" type="submit">Registrieren</button>
          </form>
        </div>

        <div class="form-container sign-in" aria-label="Anmelden">
          <form id="signin-form" novalidate>
            <h2>Anmelden</h2>

            <div class="social-icons" aria-label="Social Login (Demo)">
              <a href="#" class="icon" aria-label="Mit Google anmelden"
                ><i class="fa-brands fa-google-plus-g"></i
              ></a>
              <a href="#" class="icon" aria-label="Mit Facebook anmelden"
                ><i class="fa-brands fa-facebook-f"></i
              ></a>
              <a href="#" class="icon" aria-label="Mit GitHub anmelden"
                ><i class="fa-brands fa-github"></i
              ></a>
              <a href="#" class="icon" aria-label="Mit LinkedIn anmelden"
                ><i class="fa-brands fa-linkedin"></i
              ></a>
              <a href="#" class="icon" aria-label="Mit Xing anmelden"
                ><i class="fa-brands fa-xing"></i
              ></a>
            </div>

            <p class="muted">oder nutzen Sie Ihre E-Mail und Ihr Passwort</p>

            <label class="field">
              <span class="field__label">E-Mail</span>
              <input
                name="email"
                type="email"
                placeholder="max@mail.de"
                autocomplete="email"
                required
              />
            </label>

            <label class="field">
              <span class="field__label">Passwort</span>
              <input
                name="password"
                type="password"
                placeholder="••••••••"
                autocomplete="current-password"
                required
              />
            </label>

            <a href="#" class="pw-vergessen">Passwort vergessen?</a>

            <button class="primary-btn" type="submit">Anmelden</button>
          </form>
        </div>

        <div class="toggle-container" aria-hidden="true">
          <div class="toggle">
            <div class="toggle-panel toggle-left">
              <h2>Willkommen zurück!</h2>
              <p>Bitte melden Sie sich an, um fortzufahren.</p>
              <button class="ghost-btn" type="button" id="login">
                Anmelden
              </button>
            </div>

            <div class="toggle-panel toggle-right">
              <h2>Herzlich willkommen!</h2>
              <p>Erstellen Sie ein Konto, um loszulegen.</p>
              <button class="ghost-btn" type="button" id="register">
                Registrieren
              </button>
            </div>
          </div>
        </div>
      </section>

      <p id="status" class="status" role="status" aria-live="polite"></p>
    </main>

    <script src="script.js"></script>
  </body>
</html>
